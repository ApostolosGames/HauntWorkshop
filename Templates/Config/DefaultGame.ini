; HAUNT Workshop map project - packaging settings (UE 5.8.1).
; Merge into your project's Config/DefaultGame.ini. Replace MyName_MyMap and MyMap with your plugin and map.

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bUseZenStore=False
bGenerateChunks=False
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=False
bCookAll=False
bCookMapsOnly=True
bSkipEditorContent=True
bSkipMovies=True
bCompressed=True
bEncryptPakIniFiles=False
bEncryptPakIndex=False
bEncryptUAssetFiles=False
bEncryptAllAssetFiles=False
IncludePrerequisites=False
IncludeCrashReporter=False
IncludeDebugFiles=False
; Only your one map.
+MapsToCook=(FilePath="/MyName_MyMap/Maps/MyMap")
; The sizing templates must never ship.
+DirectoriesToNeverCook=(Path="/Game/HAUNT_Templates")
; Engine plugin content that gets cooked by default but no map uses (the NNE denoiser model alone is ~100 MB).
; /Engine/Maps keeps the engine's Entry map out, so the cook holds exactly one .umap.
-DirectoriesToAlwaysCook=(Path="/NNEDenoiser")
+DirectoriesToNeverCook=(Path="/NNEDenoiser")
+DirectoriesToNeverCook=(Path="/InterchangeAssets")
+DirectoriesToNeverCook=(Path="/ControlRig")
+DirectoriesToNeverCook=(Path="/Engine/VREditor")
+DirectoriesToNeverCook=(Path="/Engine/Maps")

; HAUNT finds the map through the cooked Asset Registry.
[Pak]
+DirectoryIndexKeepFiles="*.umap"
+DirectoryIndexKeepFiles="*AssetRegistry.bin"
