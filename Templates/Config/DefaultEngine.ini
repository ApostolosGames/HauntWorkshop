; HAUNT Workshop map project - engine settings (UE 5.8.1).
; Merge these sections into your project's Config/DefaultEngine.ini, then restart the editor.
;
; Rendering: use UE 5.8's default rendering settings. Leave Project Settings > Rendering as a new project has it.

; Cook shaders for both DirectX 12 (SM6) and DirectX 11 (SM5); HAUNT players use either.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

; Replace MyName_MyMap and MyMap with your plugin and map. The default map must not be the engine's Entry map, or it gets cooked as a second .umap.
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/MyName_MyMap/Maps/MyMap.MyMap
EditorStartupMap=/MyName_MyMap/Maps/MyMap.MyMap
ServerDefaultMap=/MyName_MyMap/Maps/MyMap.MyMap
TransitionMap=

; HAUNT's footstep sounds by Surface Type slot. HAUNT goes by the slot; these names only label them in your editor.
[/Script/Engine.PhysicsSettings]
+PhysicalSurfaces=(Type=SurfaceType1,Name="WOOD")
+PhysicalSurfaces=(Type=SurfaceType2,Name="STONE")
+PhysicalSurfaces=(Type=SurfaceType3,Name="METAL")
+PhysicalSurfaces=(Type=SurfaceType4,Name="GRASS")
+PhysicalSurfaces=(Type=SurfaceType5,Name="CARPET")
